name: Android CI Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare debug signing keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Ensure Secrets Gradle .env exists
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              printf 'SMTP_EMAIL=Nichemployeeattendance@gmail.com\nSMTP_APP_PASSWORD=MY_GMAIL_APP_PASSWORD\n' > .env
            fi
          fi

      - name: Prepare Firebase google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret."
          elif [ -f app/google-services.json ]; then
            echo "Using repository app/google-services.json."
          else
            echo "::warning::app/google-services.json not found in checkout. Add GOOGLE_SERVICES_JSON secret in GitHub repo settings to bundle live Firebase config into CI APKs."
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK Signature, Alignment & Package Clean Archive
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_SRC"
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR="$SDK_DIR/build-tools/$(ls "$SDK_DIR/build-tools" | sort -V | tail -n1)"

          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK_SRC" | tail -n 10
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_SRC"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_SRC" | head -n 10
          unzip -tq "$APK_SRC"

          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo '2.0')"
          APK_NAME="NICH-Attendance-3-v${VERSION_NAME}-debug.apk"
          ZIP_NAME="NICH-Attendance-3-v${VERSION_NAME}-debug-apk.zip"

          rm -rf dist
          mkdir -p dist
          cp "$APK_SRC" "dist/$APK_NAME"

          # Create a standard PKZIP 2.0 deflate archive (no ZIP64 streaming descriptors)
          # so built-in Android & Windows extractors open it cleanly without corruption errors.
          zip -j -6 "dist/$ZIP_NAME" "dist/$APK_NAME"
          unzip -tq "dist/$ZIP_NAME"
          ls -lh dist/

          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "APK_NAME=$APK_NAME"
            echo "ZIP_NAME=$ZIP_NAME"
          } >> "$GITHUB_ENV"

          {
            printf '## NICH Employee Attendance 3 v%s\n\n' "$VERSION_NAME"
            printf -- '- **Direct Android Install (Recommended):** Download `%s` directly and tap to install (no ZIP extraction needed).\n' "$APK_NAME"
            printf -- '- **Standard ZIP Archive:** `%s` is verified with `unzip -tq` (standard PKZIP format compatible with Android My Files / Files by Google / Windows Explorer).\n' "$ZIP_NAME"
            printf -- '- **Verified:** `apksigner verify`, `zipalign`, and `aapt2 dump badging` all passed.\n'
            printf -- '- If Android shows *"App not installed / package conflicts"*, uninstall any older build signed with a different key once before installing.\n'
          } > dist/RELEASE_NOTES.md

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nich-attendance-3-debug-apk
          path: dist/${{ env.APK_NAME }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${{ env.APK_NAME }}" "dist/${{ env.ZIP_NAME }}" --clobber
            gh release edit "$TAG" \
              --title "NICH Employee Attendance 3 v${{ env.VERSION_NAME }} (Direct APK)" \
              --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" "dist/${{ env.APK_NAME }}" "dist/${{ env.ZIP_NAME }}" \
              --title "NICH Employee Attendance 3 v${{ env.VERSION_NAME }} (Direct APK)" \
              --notes-file dist/RELEASE_NOTES.md
          fi
